# Build the ingestor image and publish it to GitHub Container Registry (GHCR)
# on every push to main (and on version tags). Listeners running the published
# image + watchtower then auto-update to each new build.
#
# One-time setup after creating the repo:
#   - No secrets needed: GITHUB_TOKEN is provided automatically.
#   - After the first run, make the package public:
#       repo → Packages → ingestor → Package settings → Change visibility → Public
#     (so community members can `docker pull` without authenticating).

name: Publish ingestor image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 image too, so Raspberry Pi
      # and other ARM hosts get a native image instead of "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ingestor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
